name: Deploy data-service

on:
  push:
    branches: [main]
    paths:
      - "service-c/**"
      - ".github/workflows/deploy-data.yml"
  workflow_dispatch:

env:
  PROJECT_ID: opentelemetry-nrb
  REGION: us-central1
  SERVICE: data-service
  RUNTIME_SA: otel-run@opentelemetry-nrb.iam.gserviceaccount.com
  OTEL_ENDPOINT: https://otel-collector-576253872784.us-central1.run.app:443

concurrency:
  group: deploy-data-service
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/576253872784/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-deploy@opentelemetry-nrb.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source service-c \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --network obs-vpc \
            --subnet subnet-apis \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=data-database-url:latest" \
            --set-env-vars "OTEL_SERVICE_NAME=data-service,OTEL_EXPORTER_OTLP_PROTOCOL=grpc,OTEL_METRIC_EXPORT_INTERVAL=5000,OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_ENDPOINT,DB_POOL_SIZE=5,DB_MAX_OVERFLOW=5" \
            --port 8082 \
            --allow-unauthenticated \
            --quiet
