name: Deploy orders-api

on:
  push:
    branches: [main]
    paths:
      - "service-a/**"
      - ".github/workflows/deploy-orders.yml"
  workflow_dispatch:

env:
  PROJECT_ID: opentelemetry-nrb
  REGION: us-central1
  SERVICE: orders-api
  RUNTIME_SA: otel-run@opentelemetry-nrb.iam.gserviceaccount.com
  SQL_INSTANCE: opentelemetry-nrb:us-central1:otel-pg
  INVENTORY_URL: https://inventory-api-576253872784.us-central1.run.app
  OTEL_ENDPOINT: https://otel-collector-576253872784.us-central1.run.app:443

concurrency:
  group: deploy-orders-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/576253872784/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-deploy@opentelemetry-nrb.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source service-a \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets "DATABASE_URL=orders-database-url:latest" \
            --set-env-vars "INVENTORY_URL=$INVENTORY_URL,OTEL_SERVICE_NAME=orders-api,OTEL_EXPORTER_OTLP_PROTOCOL=grpc,OTEL_METRIC_EXPORT_INTERVAL=5000,OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_ENDPOINT" \
            --port 8080 \
            --allow-unauthenticated \
            --quiet
